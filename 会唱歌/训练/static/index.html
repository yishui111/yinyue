<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>训练工作台 · 自己的唱歌音色</title>
<style>
  :root { --bg:#0f1220; --card:#181c2f; --card2:#1f2440; --line:#2b3154;
          --tx:#e8eaf6; --dim:#9aa1c0; --ok:#3ddc84; --bad:#ff5d73; --acc:#7c8cff; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px; background:var(--bg); color:var(--tx);
         font:15px/1.6 "Microsoft YaHei","PingFang SC",sans-serif; }
  header, main { max-width:980px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:18px 20px; margin-bottom:16px; display:flex; flex-direction:column; gap:12px; }
  h2 { margin:0; font-size:17px; }
  label { font-size:13px; color:var(--dim); display:block; margin:0 0 4px; }
  input, select { width:100%; background:var(--card2); color:var(--tx); border:1px solid var(--line);
                  border-radius:8px; padding:8px 10px; font:inherit; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .row > div { flex:1; min-width:200px; }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px;
           padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--tx); font-weight:400; }
  .hint { color:var(--dim); font-size:12.5px; }
  pre { background:#0c0f1a; border:1px solid var(--line); border-radius:8px; padding:12px;
        font:12.5px/1.5 Consolas,monospace; max-height:340px; overflow:auto; white-space:pre-wrap; }
  .msg { border-radius:8px; padding:10px 14px; font-size:13.5px; display:none; white-space:pre-wrap; }
  .msg.err { background:rgba(255,93,115,.12); color:var(--bad); display:block; }
  .msg.ok { background:rgba(61,220,132,.12); color:var(--ok); display:block; }
  .voices { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { background:var(--card2); border:1px solid var(--line); border-radius:999px;
          padding:3px 12px; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>🎓 训练工作台 · 自己的二次元唱歌音色</h1>
  <div class="sub">素材 → so-vits-svc 4.1 训练 → 自动导出到 <b>换声引擎\models\</b> → 去「会唱歌」工作台用这个音色唱歌</div>
</header>
<main>
  <div class="card">
    <h2>① 准备素材</h2>
    <div class="hint">把该角色的<b>干净人声</b>（无伴奏/无混响，3~10 分钟以上，wav/mp3 都行）
      放进一个文件夹，下面填这个文件夹的路径。训练前会自动重采样到 44.1kHz 单声道。</div>
  </div>

  <div class="card">
    <h2>② 开始训练</h2>
    <div class="row">
      <div><label>角色名（字母/数字/中文，不能有空格）</label><input id="role" placeholder="例如：我的音色"></div>
      <div style="flex:1.6"><label>素材文件夹完整路径</label><input id="material" placeholder="例如 G:\素材\我的声音"></div>
      <div style="max-width:150px"><label>音高提取器</label>
        <select id="f0"><option>rmvpe</option><option>pm</option><option>crepe</option><option>fcpe</option></select></div>
    </div>
    <div class="row">
      <button id="btnStart">🚀 开始训练（底模微调，小时级）</button>
      <button class="ghost" id="btnStop">⏹ 停止（保留断点）</button>
      <button class="ghost" id="btnExport">📦 导出当前进度到换声引擎</button>
    </div>
    <div class="hint">训练可中断：再次开始会从断点续训。中途想先用，点「导出」就能在工作台选到这个角色。</div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <h2>③ 训练日志 / 状态</h2>
    <pre id="log">（空闲）</pre>
    <div class="hint">已就绪的音色：<span class="voices" id="voices"></span>（在「会唱歌」工作台 http://127.0.0.1:8102 选用）</div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
function msg(t, cls) { const e = $('msg'); e.className = 'msg ' + (cls||''); e.textContent = t||''; }

async function refresh() {
  try {
    const r = await fetch('/api/status'); const s = await r.json();
    $('log').textContent = s.log || '（空闲）';
    $('log').scrollTop = $('log').scrollHeight;
    const v = $('voices'); v.innerHTML = '';
    (s.voices || []).forEach(n => { const c = document.createElement('span'); c.className='chip'; c.textContent = n; v.appendChild(c); });
    $('btnStart').disabled = s.running;
    $('btnStop').disabled = !s.running;
    if (s.running) msg('正在训练「' + s.role + '」，已进行 ' + s.elapsed + ' 秒', 'ok');
  } catch (e) {}
}
$('btnStart').onclick = async () => {
  const r = await fetch('/api/start', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({role: $('role').value.trim(), material: $('material').value.trim(), f0: $('f0').value})});
  const d = await r.json();
  if (!r.ok) return msg('失败：' + (d.error || ''), 'err');
  msg(d.msg, 'ok'); setTimeout(refresh, 1500);
};
$('btnStop').onclick = async () => {
  const r = await fetch('/api/stop', {method:'POST'}); const d = await r.json();
  msg(r.ok ? d.msg : ('失败：' + d.error), r.ok ? 'ok' : 'err'); setTimeout(refresh, 1500);
};
$('btnExport').onclick = async () => {
  const role = $('role').value.trim();
  if (!role) return msg('先在「角色名」里填要导出的角色', 'err');
  const r = await fetch('/api/export', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({role})});
  const d = await r.json();
  msg(r.ok ? ('导出成功：' + d.msg) : ('失败：' + (d.error||'')), r.ok ? 'ok' : 'err');
};
refresh(); setInterval(refresh, 4000);
</script>
</body>
</html>
